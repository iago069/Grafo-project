<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Diagrama compartilhado · Grafo</title>
<link rel="icon" type="image/png" href="./assets/images/app/favicon-64.png">
<style>
  :root {
    --bg: #eef3f7; --panel: #ffffff; --line: #d3dde6; --text: #16323d; --dim: #56707f;
    --accent: #0b6e8a; --accent-ink: #ffffff; --danger: #c93c2c; --paper: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a21; --panel: #17252e; --line: #2a3d49; --text: #e3edf2; --dim: #9db3c0; --accent: #5cc3dd; --accent-ink: #0f1a21; --danger: #ff7d6c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); text-decoration: none; }
  .marca img { width: 26px; height: 26px; }
  .titulo { flex: 1 1 200px; min-width: 0; }
  .titulo h1 { margin: 0; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titulo p { margin: 0; font-size: 0.8rem; color: var(--dim); }
  .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.85rem; font-weight: 600; min-height: 36px; min-width: 36px; padding: 6px 12px;
    border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  main { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; }
  main.arrastando { cursor: grabbing; }
  #quadro { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #quadro img { display: block; background: var(--paper); border-radius: 6px; box-shadow: 0 8px 30px rgba(10, 30, 40, 0.18); user-select: none; -webkit-user-drag: none; }
  .estado { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--dim); }
  .estado.erro { color: var(--danger); }
  .estado[hidden] { display: none; }
  footer { padding: 6px 16px; font-size: 0.75rem; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <a class="marca" href="/" title="Grafo"><img src="./assets/images/app/favicon-64.png" alt=""><span>Grafo</span></a>
  <div class="titulo">
    <h1 id="titulo">Diagrama compartilhado</h1>
    <p id="subtitulo">Somente visualização</p>
  </div>
  <div class="acoes" id="acoes" hidden>
    <button type="button" id="menos" aria-label="Diminuir zoom" title="Diminuir zoom">−</button>
    <button type="button" id="mais" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
    <button type="button" id="ajustar" title="Ajustar à tela">Ajustar</button>
    <button type="button" class="primario" id="baixar">Baixar SVG</button>
  </div>
</header>
<main id="area" aria-label="Diagrama">
  <div id="quadro"><img id="imagem" alt="" draggable="false"></div>
  <div class="estado" id="estado" role="status">Carregando o diagrama...</div>
</main>
<footer>Visualização somente leitura. Para editar, peça acesso a quem enviou o link.</footer>
<script src="./assets/js/paginas/ver.js"></script>
</body>
</html>
